[project]
name = "seo-keywords-madagascar"
version = "0.1.0"
description = "Collecte et analyse de mots-clés touristiques Madagascar (saisonnalité, marchés FR/EN/DE)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
    "pytrends>=4.9.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlmodel>=0.0.22",
    "typer>=0.13.0",
    "tenacity>=9.0.0",
    "rich>=13.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "responses>=0.25.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
seo-keywords = "seo_keywords.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seo_keywords"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/seo_keywords --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
